[[language]]
name = "c"
file-types = ["c", "h"]
formatter = { command = 'clang-format' }
auto-format = true

[[language]]
name = "cpp"
file-types = ["cpp", "cc", "cxx", "hpp", "hcc", "hxx"]
formatter = { command = 'clang-format' }
auto-format = true

[[language]]
name = "Makefile"
scope = "Makefile"
file-types = ["Makefile"]

[[language]]
name = "markdown"
file-types = ["md"]
language-servers = ["harper-ls"]

[language-server.eslint]
command = "vscode-eslint-language-server"
args = ["--stdio"]

# vscode-eslint-language-server does nothing without these settings (VS Code
# normally supplies them). `validate = "on"` turns diagnostics on;
# `workingDirectory.mode = "auto"` resolves eslint.config.mjs from the edited
# file's nearest folder (needed since configs live in backend/ and frontend/).
#
# IMPORTANT: `rulesCustomizations = []` and `experimental = {}` must be present
# even though empty. The server iterates `settings.rulesCustomizations` and reads
# `settings.experimental.useFlatConfig` while building each diagnostic; if either
# is missing it throws internally and silently returns ZERO diagnostics (the CLI
# `npm run lint` still works fine, which makes this very confusing to debug).
[language-server.eslint.config]
validate = "on"
run = "onType"
problems = { shortenToSingleLine = false }
nodePath = ""
workingDirectory = { mode = "auto" }
rulesCustomizations = []
experimental = {}

[[language]]
name = "javascript"
language-servers = [ "typescript-language-server", "eslint" ]
formatter = { command = 'prettier', args = ["--parser", "javascript"] }
auto-format = true

[[language]]
name = "typescript"
language-servers = [ "typescript-language-server", "eslint" ]
formatter = { command = 'prettier', args = ["--parser", "typescript"] }
auto-format = true

[language-server.harper-ls]
command = "harper-ls"
args = ["--stdio"]
